      tags:
      - transactions
  /transactions:
    get:
      description: Get all transactions for current user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_delivery_http_response.JSONResponse'
      security:
      - BearerAuth: []
      summary: Get transaction history
      tags:
      - transactions
  /transfer:
    post:
      consumes:
      - application/json
      description: Transfer balance from current user to another user
      parameters:
      - description: Transfer request
        in: body
