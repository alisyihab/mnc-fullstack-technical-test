paths:
  /login:
    post:
      consumes:
      - application/json
      description: Login user with phone number and pin
      parameters:
      - description: Login request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_domain_usecase.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_delivery_http_response.JSONResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_delivery_http_response.JSONResponse'
      summary: Login user
      tags:
      - users
  /pay:
    post:
      consumes:
      - application/json
      description: Deduct balance from current user for payment
      parameters:
      - description: Payment request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_domain_usecase.PaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_delivery_http_response.JSONResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_delivery_http_response.JSONResponse'
      security:
      - BearerAuth: []
      summary: Make a payment
      tags:
      - transactions
  /profile:
    put:
      consumes:
      - application/json
      description: Update current user's first name, last name, or address
      parameters:
      - description: Update profile request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_domain_usecase.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_delivery_http_response.JSONResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/mnc-fullstack-technical-test_tahap-2_internal_delivery_http_response.JSONResponse'
